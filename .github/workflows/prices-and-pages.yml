name: Prices and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      earnings_only:
        description: Refresh only the earnings screener stock prices
        type: boolean
        default: false
  schedule:
    # 08:00 and retry 10:17 KST, Tuesday through Saturday. After US close in both DST seasons.
    - cron: '0 23 * * 1-5'
    - cron: '17 1 * * 2-6'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/update-prices.test.mjs
      - run: node --test scripts/update-vix.test.mjs
      - run: node --test scripts/update-breadth.test.mjs
      - run: node --test scripts/adr-core.test.mjs scripts/update-adr.test.mjs scripts/weekly-sma-core.test.mjs
      - run: node --test scripts/earnings-prices-core.test.mjs scripts/update-earnings-prices.test.mjs
      - name: Refresh completed daily prices
        id: portfolio
        if: github.event_name != 'push' && inputs.earnings_only != true
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/update-prices.mjs
      - name: Refresh VIX daily closes
        if: github.event_name != 'push' && inputs.earnings_only != true
        continue-on-error: true
        run: node scripts/update-vix.mjs
      - name: Refresh earnings screener stock prices
        id: earnings
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/update-earnings-prices.mjs
      - name: Refresh SPY and RSP adjusted daily closes
        id: breadth
        if: github.event_name != 'push' && inputs.earnings_only != true
        continue-on-error: true
        run: node scripts/update-breadth.mjs
      - name: Refresh classification ADR and completed weekly SMA
        id: adr
        if: github.event_name != 'push' && inputs.earnings_only != true
        continue-on-error: true
        timeout-minutes: 18
        env:
          ADR_CACHE_DIR: ${{ runner.temp }}/adr-cache
        run: node scripts/update-adr.mjs
      - name: Save validated prices and ADR
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.json data/manifest.json data/vix.json data/breadth.json data/adr.json data/adr-state.json data/weekly-sma.json 'data/earnings-prices/*.json'
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh completed US market prices'
          git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report collection failure after preserving and publishing available data
        if: github.event_name != 'push' && (steps.portfolio.outcome == 'failure' || steps.earnings.outcome == 'failure' || steps.breadth.outcome == 'failure' || steps.adr.outcome == 'failure')
        run: exit 1
